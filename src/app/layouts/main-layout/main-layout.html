<mat-sidenav-container class="app-shell">
  <mat-sidenav mode="side" opened class="app-sidenav">
    <div class="brand">
      <mat-icon>inventory_2</mat-icon>
      <span>Ajuste de Inventario</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/solicitudes" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>Bandeja de solicitudes</span>
      </a>
      <a mat-list-item routerLink="/solicitudes/nueva" routerLinkActive="active">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>Nueva solicitud</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      <span>Ajuste de Inventario · PROGEN</span>
      <span class="spacer"></span>
      <span class="usuario-demo">Prototipo local — datos simulados</span>
    </mat-toolbar>
    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-loading-spinner />
